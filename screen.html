   if(r.swf>.005){const d=Math.min(6.5,Math.max(1,CK/r.swf));r.fwd=-1.6+(6.5-d)/5.5*2.35}r.lat=(.5-m.h[0])*3}};
 ws.onclose=()=>{if(mode=='lobby')setTimeout(connect,1000)}}
function lobbyUI(){robots.forEach((r,i)=>{const e=$('pl'+i);e.className='pl'+(r.on?' on':'')+(r.ready?' rd':'');e.textContent=`Игрок ${i+1}: `+(r.ready?'готов ✔':r.on?'подключён, ждём проверку…':'ждём…')});$('fight').disabled=!(robots[0].ready&&robots[1].ready)}
// ---------- UI
const panels=['menu','set','chars','lobby','hud','result'];const show=n=>panels.forEach(p=>$(p).classList.toggle('on',p==n||(n=='fight'&&p=='hud')));
function go(m){mode=m;show(m);if(m=='lobby'){connect();lobbyUI()}if(m=='menu'){F=null;phoneSend('all',{t:'fight',on:false});$('big').classList.remove('on')}}
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go('menu'));
$('bs').onclick=()=>go('lobby');$('bt').onclick=()=>go('set');$('bc').onclick=()=>go('chars');
function rows(id,list){const el=$(id);el.innerHTML='';for(const o of list){const d=document.createElement('div');d.className='row';d.innerHTML=`<span>${o.l}</span><span><button>◀</button> <i></i> <button>▶</button></span>`;
 const i=d.querySelector('i'),[b1,b2]=d.querySelectorAll('button'),u=()=>i.textContent=o.show();b1.onclick=()=>{o.step(-1);u();save()};b2.onclick=()=>{o.step(1);u();save()};u();el.append(d)}}
const cyc=(k,vals,l,fmt=v=>v)=>({l,show:()=>fmt(SET[k]),step:d=>{SET[k]=vals[(vals.indexOf(SET[k])+d+vals.length)%vals.length];snd(500,.08)}});
rows('setrows',[cyc('rounds',[1,3,5],'Раундов'),cyc('time',[60,90,120],'Время раунда, сек'),cyc('dmg',[.7,1,1.5],'Сила ударов',v=>'×'+v),cyc('vol',[0,.3,.6,1],'Громкость',v=>Math.round(v*100)+'%')]);
rows('charrows',[0,1].map(i=>({l:'Игрок '+(i+1),show:()=>SK[SET.sk[i]].n,step:d=>{SET.sk[i]=(SET.sk[i]+d+SK.length)%SK.length;build(robots[i])}})));
$('fight').onclick=()=>startFight();addEventListener('keydown',e=>{if(e.key=='Escape')go('menu');if((e.key=='Enter'||e.key==' ')&&mode=='lobby'&&!$('fight').disabled)startFight();if(e.key=='Enter'&&mode=='result')startFight()});
// ---------- бой
const st=()=>({hp:100,pts:0,thrown:0,landed:0,max:0,dmg:0,combo:0,ct:0});
const big=(t,d)=>{const b=$('big');b.textContent=t;b.classList.add('on');if(d)setTimeout(()=>b.classList.remove('on'),d)};
async function startFight(){F={s:[st(),st()],t:SET.time,round:1,tot:SET.rounds,wins:[0,0],rp:[0,0]};await runRound()}
async function runRound(){const tk=F,wt=ms=>new Promise(r=>setTimeout(r,ms));
 mode='count';show('hud');F.s.forEach(x=>{x.hp=100;x.combo=0});F.t=SET.time;F.rp=[0,0];hud();$('cmb').textContent='';
 phoneSend('all',{t:'fight',on:false});phoneSend('all',{t:'hp',v:100});robots.forEach(r=>{r.knock=0;r.sw0=r.swf||r.sw0});
 big('РАУНД '+F.round,1100);phoneSend('all',{t:'msg',text:'Раунд '+F.round});await wt(1300);if(mode!='count'||F!==tk)return;
 for(const n of [3,2,1]){big(n);snd(440,.2,'square',.2);phoneSend('all',{t:'msg',text:String(n)});await wt(1000);if(mode!='count'||F!==tk)return}
 big('БОКС!',900);snd(880,1.2,'sine',.5);phoneSend('all',{t:'msg',text:'БОКС!'});phoneSend('all',{t:'fight',on:true});mode='fight'}

function hud(){const f=F.s;[0,1].forEach(i=>{$('h'+i).style.width=Math.max(0,f[i].hp)+'%';$('s'+i).textContent=`Игрок ${i+1} · ${f[i].pts} очков · ${f[i].landed}/${f[i].thrown} ударов`});$('tm').innerHTML=Math.ceil(F.t)+`<small style="display:block;font:700 18px Bahnschrift,sans-serif;opacity:.8">Раунд ${F.round}/${F.tot} · ${F.wins[0]}:${F.wins[1]}</small>`}
const wp=(o)=>o.getWorldPosition(V());
function combat(dt){
 const f=F.s;F.t-=dt;
 for(const a of [0,1]){const A=robots[a],D=robots[1-a],dh=wp(D.head),dc=wp(D.T3).add(V(0,.4,0).applyQuaternion(D.T3.getWorldQuaternion(q))),
  guard=['gL','gR'].some(k=>wp(D[k]).distanceTo(dh)<.3);
  for(const k of ['gL','gR']){const gs=A['gs'+k[1]],p=wp(A[k]);const sp=gs.prev?p.distanceTo(gs.prev)/dt:0;gs.prev=p;gs.sw=gs.sw*.8+sp*.2;const v=gs.sw;f[a].max=Math.max(f[a].max,v);
   if(v>2.6&&!gs.on){gs.on=true;gs.hit=false;f[a].thrown++}if(v<1.3)gs.on=false;
   if(gs.on&&!gs.hit){const hd=p.distanceTo(dh)<.3,ch=p.distanceTo(dc)<.36;
    if(hd||ch){gs.hit=true;const raw=THREE.MathUtils.clamp(v*2.4,5,24)*SET.dmg*(hd?1.5:1),blk=guard&&ch||guard&&hd,d=Math.round(blk?raw*.25:raw);
     f[1-a].hp-=d;f[a].landed++;f[a].dmg+=d;f[a].ct=2;f[a].combo++;const pts=d*10+(f[a].combo>1?f[a].combo*15:0);f[a].pts+=pts;F.rp[a]+=pts;
     D.flash=blk?.3:1;D.knock-=blk?.05:.04*d;shake=blk?.04:.1;spark(p,blk?10:40);ftext(p,blk?'БЛОК':'-'+d+(f[a].combo>2?' ×'+f[a].combo:''),blk?'#36e2ff':hd?'#ffe14a':'#ff5a1f');
     snd(blk?600:140,blk?.08:.18,blk?'triangle':'square',.5,blk?300:40);phoneSend(1-a,{t:'hit',block:blk});phoneSend(1-a,{t:'hp',v:Math.max(0,f[1-a].hp)});
     $('cmb').textContent=f[a].combo>1?`КОМБО ×${f[a].combo}  Игрок ${a+1}`:''}}}
  f[a].ct-=dt;if(f[a].ct<=0)f[a].combo=0}
 hud();if(F.s.some(x=>x.hp<=0)||F.t<=0)endRound()}
function endRound(){mode='over';const f=F.s,ko=f.findIndex(x=>x.hp<=0),w=ko>=0?1-ko:F.rp[0]!=F.rp[1]?(F.rp[0]>F.rp[1]?0:1):(f[0].hp>=f[1].hp?0:1),tk=F;F.wins[w]++;
 phoneSend('all',{t:'fight',on:false});snd(880,1.5,'sine',.5);big(ko>=0?'НОКАУТ!':'ГОНГ!',1800);hud();
 setTimeout(()=>{if(F!==tk)return;if(F.wins[w]>=Math.ceil(F.tot/2)||F.round>=F.tot)finish();else{F.round++;runRound()}},2600)}
function finish(){mode='over';const f=F.s,wn=F.wins,w=wn[0]!=wn[1]?(wn[0]>wn[1]?0:1):(f[0].pts>=f[1].pts?0:1);
 ws&&ws.readyState==1&&ws.send(JSON.stringify({t:'result',winner:w,ko:f.some(x=>x.hp<=0),duration:SET.time*F.round,p1:{...f[0],rounds:wn[0]},p2:{...f[1],rounds:wn[1]}}));
 const row=(l,g)=>`<tr><td>${l}</td><td>${g(f[0],0)}</td><td>${g(f[1],1)}</td></tr>`;
 $('result').innerHTML=`<h2>Победил игрок ${w+1}</h2><table><tr><td></td><td>Игрок 1</td><td>Игрок 2</td></tr>${row('Раунды',(x,i)=>wn[i])}${row('Очки',x=>x.pts)}${row('Ударов',x=>x.thrown)}${row('Попаданий',x=>x.landed)}${row('Точность',x=>x.thrown?Math.round(x.landed/x.thrown*100)+'%':'—')}${row('Урон',x=>x.dmg)}${row('Макс. скорость',x=>x.max.toFixed(1)+' м/с')}</table><button class=b id=rm>Реванш</button><button class=b id=mn>В меню</button>`;
 show('result');mode='result';$('rm').onclick=startFight;$('mn').onclick=()=>go('menu');
 setTimeout(()=>fetch('/api/top').then(r=>r.json()).then(a=>{if(a.length)$('result').insertAdjacentHTML('beforeend','<div style="font-size:16px;opacity:.7;margin-top:10px">Последние бои: '+a.map(x=>`${new Date(x.created_at).toLocaleDateString()} игрок ${x.winner+1} (${x.p1.pts}:${x.p2.pts})`).join(' · ')+'</div>')}).catch(()=>{}),600);
 phoneSend(w,{t:'msg',text:'ПОБЕДА!'});phoneSend(1-w,{t:'msg',text:'Поражение'})}

// ---------- цикл
let shake=0,tPrev=performance.now();
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
(function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-tPrev)/1e3);tPrev=now;
 robots.forEach(r=>{padUpdate(r,dt);pose(r,dt)});S.updateMatrixWorld(true);
 if(mode=='fight')combat(dt);
 for(let i=0;i<N;i++){if(pl[i]>0){pl[i]-=dt;pv[i].y-=9*dt;pp[i*3]+=pv[i].x*dt;pp[i*3+1]+=pv[i].y*dt;pp[i*3+2]+=pv[i].z*dt;if(pl[i]<=0)pp[i*3+1]=-99}}pg.attributes.position.needsUpdate=true;
 shake*=Math.pow(.01,dt);const t=now/1e3,kk=Math.max(1,1.78/cam.aspect);cam.position.set(camBase.x+Math.sin(t*.3)*.5+(Math.random()-.5)*shake,camBase.y*kk+(Math.random()-.5)*shake,camBase.z*kk);cam.lookAt(0,.8,0);R.render(S,cam)})();
show('menu');
